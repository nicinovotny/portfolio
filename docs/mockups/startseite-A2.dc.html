<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Höhenlinie verfeinert – Startseite</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@200;300;400&amp;family=Geist+Mono:wght@400&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#ECE8E1;text-decoration:none}a:hover{color:#A9C4C4}
</style>
</helmet>
<div style="width: 1280px; height: 800px; position: relative; overflow: hidden; background: #0B0D0E; font-family: 'Geist', system-ui, sans-serif; color: #ECE8E1">

<div style="position: absolute; left: 0; top: 0">
<dc-import name="Landscape" variant="fjord" w="{{ 1280 }}" h="{{ 800 }}" uid="a21" sky="#161D22" skylow="#3C474D" far="#283238" mid="#1A2227" near="#0D1113" water="#222B31" glow="#A9C4C4" hint-size="1280px,800px"></dc-import>
</div>

<div style="position: absolute; left: 0; bottom: 0; width: 1280px; height: 440px; background: linear-gradient(to top, rgba(11,13,14,0.92), rgba(11,13,14,0))"></div>

<svg aria-hidden="true" width="1280" height="800" viewBox="0 0 1280 800" style="position: absolute; left: 0; top: 0">
<g fill="none" stroke="#A9C4C4" stroke-width="0.75" opacity="0.09">
<path d="M860,0 C950,96 1100,120 1280,92"></path>
<path d="M800,0 C920,160 1110,192 1280,170"></path>
<path d="M740,0 C890,220 1120,262 1280,250"></path>
</g>
<g fill="none" stroke="#ECE8E1" stroke-width="0.75" opacity="0.35">
<path d="M28,758 L28,772 L42,772"></path>
<path d="M1238,772 L1252,772 L1252,758"></path>
</g>
</svg>

<sc-if value="{{ plain }}" hint-placeholder-val="{{ true }}">
<svg aria-hidden="true" width="1280" height="60" viewBox="0 0 1280 60" style="position: absolute; left: 0; top: 0">
<g fill="none" stroke="#ECE8E1" stroke-width="0.75" opacity="0.35">
<path d="M28,42 L28,28 L42,28"></path>
<path d="M1238,28 L1252,28 L1252,42"></path>
</g>
</svg>
<header style="position: absolute; left: 64px; right: 64px; top: 40px; height: 44px; display: flex; justify-content: space-between; align-items: center">
<a href="#start" style="font-size: 11px; font-weight: 400; letter-spacing: 0.34em; text-transform: uppercase">Nicolas Novotny</a>
<nav aria-label="Hauptnavigation" style="display: flex; align-items: center; gap: 36px; font-size: 13px; font-weight: 300; letter-spacing: 0.04em">
<a href="#karte">Karte</a>
<a href="#alben">Alben</a>
<a href="#ueber">Über mich</a>
<span aria-hidden="true" style="width: 1px; height: 14px; background: rgba(236,232,225,0.22)"></span>
<a href="#instagram" aria-label="Instagram" style="display: flex; padding: 14px; margin: -14px -6px">
<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.25"><rect x="3" y="3" width="18" height="18" rx="5"></rect><circle cx="12" cy="12" r="4"></circle><circle cx="17.5" cy="6.5" r="0.6" fill="currentColor"></circle></svg>
</a>
<a href="#linkedin" aria-label="LinkedIn" style="display: flex; padding: 14px; margin: -14px -6px">
<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.25"><rect x="3" y="3" width="18" height="18" rx="3"></rect><path d="M8 10v7M8 7v.01M12 17v-4a2 2 0 0 1 4 0v4M12 10v7"></path></svg>
</a>
</nav>
</header>
</sc-if>

<sc-if value="{{ glass }}" hint-placeholder-val="{{ false }}">
<header style="position: absolute; left: 28px; right: 28px; top: 22px; height: 58px; box-sizing: border-box; padding: 0 14px 0 30px; display: flex; justify-content: space-between; align-items: center; border-radius: 20px; background: rgba(22,27,30,0.36); border: 1px solid rgba(236,232,225,0.14); box-shadow: inset 0 1px 0 rgba(255,255,255,0.09), 0 10px 40px rgba(0,0,0,0.28); backdrop-filter: blur(22px) saturate(160%); -webkit-backdrop-filter: blur(22px) saturate(160%)">
<a href="#start" style="font-size: 11px; font-weight: 400; letter-spacing: 0.34em; text-transform: uppercase">Nicolas Novotny</a>
<nav aria-label="Hauptnavigation" style="display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 300; letter-spacing: 0.04em">
<a href="#karte" style="padding: 10px 16px; border-radius: 12px">Karte</a>
<a href="#alben" style="padding: 10px 16px; border-radius: 12px">Alben</a>
<a href="#ueber" style="padding: 10px 16px; border-radius: 12px">Über mich</a>
<span aria-hidden="true" style="width: 1px; height: 18px; margin: 0 8px; background: rgba(236,232,225,0.18)"></span>
<a href="#instagram" aria-label="Instagram" style="display: flex; width: 44px; height: 44px; align-items: center; justify-content: center; border-radius: 12px">
<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.25"><rect x="3" y="3" width="18" height="18" rx="5"></rect><circle cx="12" cy="12" r="4"></circle><circle cx="17.5" cy="6.5" r="0.6" fill="currentColor"></circle></svg>
</a>
<a href="#linkedin" aria-label="LinkedIn" style="display: flex; width: 44px; height: 44px; align-items: center; justify-content: center; border-radius: 12px">
<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.25"><rect x="3" y="3" width="18" height="18" rx="3"></rect><path d="M8 10v7M8 7v.01M12 17v-4a2 2 0 0 1 4 0v4M12 10v7"></path></svg>
</a>
</nav>
</header>
</sc-if>

<div style="position: absolute; left: 64px; bottom: 76px; display: flex; flex-direction: column; gap: 22px">
<div style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 10px; letter-spacing: 0.24em; color: #8C9397">ALBUM 01 <span style="color: {{accent}}">—</span> 62°00′N 006°47′W</div>
<h1 style="margin: 0; font-size: 104px; font-weight: 200; letter-spacing: -0.04em; line-height: 0.9">Färöer-Inseln</h1>
<div style="display: flex; gap: 36px; align-items: center; padding-top: 6px; font-size: 14px; font-weight: 300; letter-spacing: 0.04em">
<a href="#album-faroe" style="display: flex; align-items: center; gap: 14px; padding: 12px 0">
<span aria-hidden="true" style="width: 40px; height: 1px; background: {{accent}}"></span>
Album öffnen
</a>
<a href="#karte" style="color: #9AA1A5; padding: 12px 0">Auf der Karte zeigen</a>
</div>
</div>

<div style="position: absolute; right: 64px; bottom: 84px; display: flex; flex-direction: column; align-items: flex-end; gap: 16px">
<div style="display: flex; align-items: baseline; gap: 10px">
<span style="font-size: 30px; font-weight: 200; letter-spacing: -0.02em">01</span>
<span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 10px; letter-spacing: 0.2em; color: #5E666B">/ 07</span>
</div>
<div aria-hidden="true" style="width: 168px; height: 1px; background: rgba(236,232,225,0.16)"><div style="width: 24px; height: 1px; background: {{accent}}"></div></div>
<div style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 9px; letter-spacing: 0.24em; color: #5E666B">DEMO-BILD</div>
</div>

<div aria-hidden="true" style="position: absolute; left: 640px; bottom: 28px; width: 1px; height: 28px; background: rgba(236,232,225,0.3)"></div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#A9C4C4","options":["#A9C4C4","#C8BFA9","#ECE8E1"]},"glass":{"editor":"boolean","default":false},"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    const glass = this.props.glass === true || this.props.glass === 'true';
    return { accent: this.props.accent ?? '#A9C4C4', glass, plain: !glass };
  }
}
</script>
</body>
</html>
