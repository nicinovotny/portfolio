<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Collection – Nicolas Novotny</title>
  <meta name="description" content="Fotografie von Nicolas Novotny.">
  <meta name="theme-color" content="#0B0D0E">
  <link rel="icon" href="favicon.svg?v=2" type="image/svg+xml">
  <link rel="preload" href="fonts/Geist-Variable.woff2" as="font" type="font/woff2" crossorigin>
  <!-- Seiten beim Überfahren eines Links vorab aufbauen (Chrome/Edge), damit der Wechsel sofort da ist -->
  <script type="speculationrules">
    { "prerender": [{ "where": { "href_matches": "/*" }, "eagerness": "moderate" }] }
  </script>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/gallery.css">
  <link rel="stylesheet" href="css/collection.css">
  <link rel="stylesheet" href="css/lightbox.css">
  <link rel="preconnect" href="https://fastly.picsum.photos">
  <script defer src="vendor/gsap/gsap.min.js"></script>
  <script type="module" src="js/nav.js"></script>
  <script type="module" src="js/transitions.js"></script>
  <script type="module" src="js/collection.js"></script>
</head>
<body>
  <a class="skip-link" href="#inhalt">Zum Inhalt springen</a>

  <!-- Kopfzeile: auf allen Seiten identisch -->
  <header class="site-header">
    <a class="site-name" href="./">Nicolas Novotny</a>
    <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="site-nav">Menü</button>
    <nav class="site-nav" id="site-nav" aria-label="Hauptnavigation">
      <a href="karte.html">Karte</a>
      <a href="alben.html">Alben</a>
      <a href="ueber-mich.html">Über mich</a>
      <span class="site-nav__divider" aria-hidden="true"></span>
      <span class="site-nav__social">
        <a class="site-nav__icon" href="https://www.instagram.com/nici.novotny/" aria-label="Instagram" target="_blank" rel="me noopener">
          <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.25"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="0.6" fill="currentColor"/></svg>
        </a>
        <a class="site-nav__icon" href="https://www.linkedin.com/in/nicolas-novotny/" aria-label="LinkedIn" target="_blank" rel="me noopener">
          <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.25"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M8 10v7M8 7v.01M12 17v-4a2 2 0 0 1 4 0v4M12 10v7"/></svg>
        </a>
      </span>
    </nav>
  </header>

  <!-- Inhalt wird aus data/albums.json befüllt (?id=<collection>, optional &bild=<entryId>/<imageId>) -->
  <main id="inhalt" class="page collection" data-collection>
    <header class="collection-head">
      <p class="label" data-collection-position>&nbsp;</p>
      <h1 class="collection-head__title" data-collection-name>&nbsp;</h1>
      <div class="collection-head__meta">
        <p class="collection-head__text" data-collection-text></p>
        <p class="collection-head__readout label" data-collection-readout></p>
      </div>
    </header>

    <!-- Abschnitte (Trips, Shoots, Frames) setzt js/collection.js ein -->
    <div class="collection-sections" data-collection-sections></div>

    <!-- Nächste Collection (mit Umlauf) und Übersicht -->
    <nav class="collection-pager" data-collection-pager aria-label="Weitere Collections" hidden>
      <a class="collection-pager__all label" data-collection-all href="alben.html"><span aria-hidden="true">←</span> Alle Collections</a>
      <a class="collection-pager__next" data-collection-next href="#">
        <span class="label">Nächste Collection <span class="label__dash">—</span> <span data-collection-next-number></span> <span aria-hidden="true">→</span></span>
        <span class="collection-pager__name" data-collection-next-name></span>
      </a>
    </nav>
  </main>

  <!-- Großansicht (Lightbox) für die Frames: Markup erzeugt js/lightbox.js -->

  <footer class="site-footer">
    <span class="label label--quiet">© 2026 Nicolas Novotny</span>
    <span class="site-footer__links">
      <a class="label label--quiet" href="impressum.html">Impressum</a>
      <a class="label label--quiet" href="impressum.html#datenschutz">Datenschutz</a>
    </span>
  </footer>
</body>
</html>
