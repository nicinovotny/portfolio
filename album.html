<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Weiterleitung – Nicolas Novotny</title>
  <meta name="robots" content="noindex">
  <!-- Alte Adresse album.html?ort=<id> (vor dem Umbau, Oktober 2026) → entry.html?id=<id>.
       Umbenannte ids (z. B. kleinarl → kleinarl-2025) ersetzt entry.html selbst. -->
  <script>
    (() => {
      const params = new URLSearchParams(location.search);
      const id = params.get('ort');
      location.replace(id ? `entry.html?id=${encodeURIComponent(id)}${location.hash}` : 'collections.html');
    })();
  </script>
  <!-- Ohne JavaScript: zur Übersicht (die Eintragsseite braucht ohnehin JavaScript) -->
  <noscript><meta http-equiv="refresh" content="0; url=collections.html"></noscript>
  <link rel="icon" href="favicon.svg?v=2" type="image/svg+xml">
  <style>body { background: #0B0D0E; color: #ECE8E1; font-family: system-ui, sans-serif; padding: 2rem; }</style>
</head>
<body>
  <p>Diese Seite ist umgezogen. <a href="collections.html" style="color: #A9C4C4">Weiter zur Übersicht</a></p>
</body>
</html>
